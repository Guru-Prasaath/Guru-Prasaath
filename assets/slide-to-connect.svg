<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 170" width="1200" height="170" role="img" aria-labelledby="title">
  <title id="title">Slide to say hello: email D Guru Prasaath</title>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset=".6" stop-color="#1D1A5A"/>
      <stop offset="1" stop-color="#2E1745"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="shimmer" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".45" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset=".55" stop-color="#FFFFFF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".35"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0;260 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="50"/>
    </filter>
    <clipPath id="screen">
      <rect width="1200" height="170" rx="40"/>
    </clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .knob { animation: nudge 3s cubic-bezier(.4,0,.2,1) infinite; }
    @keyframes nudge { 0%, 60%, 100% { transform: translateX(0); } 75% { transform: translateX(22px); } }
    @media (prefers-reduced-motion: reduce) { .knob { animation: none; } }
  </style>
  <g clip-path="url(#screen)">
    <rect width="1200" height="170" fill="url(#wall)"/>
    <g filter="url(#blur)">
      <circle cx="220" cy="120" r="140" fill="#5E5CE6" opacity=".55"/>
      <circle cx="1000" cy="40" r="140" fill="#FF9F0A" opacity=".3"/>
    </g>
    <rect x="300" y="47" width="600" height="76" rx="38" fill="#FFFFFF" fill-opacity=".11" stroke="url(#glassEdge)" stroke-width="1.2"/>
    <text x="640" y="94" text-anchor="middle" font-size="26" font-weight="500" fill="url(#shimmer)">slide to say hello</text>
    <g class="knob">
      <circle cx="344" cy="85" r="31" fill="#FFFFFF"/>
      <path d="M337 72 L351 85 L337 98" fill="none" stroke="#0A84FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
