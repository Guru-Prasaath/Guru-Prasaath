<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title desc">
  <title id="title">D Guru Prasaath</title>
  <desc id="desc">An iPhone-style lock screen introducing D Guru Prasaath, an AI/ML and backend engineer and iOS developer from Chennai, India.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset=".55" stop-color="#1D1A5A"/>
      <stop offset="1" stop-color="#2E1745"/>
    </linearGradient>
    <linearGradient id="nameFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D4D2FF"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB340"/>
      <stop offset="1" stop-color="#FF7A00"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4CE07A"/>
      <stop offset="1" stop-color="#12A150"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="screen">
      <rect width="1200" height="700" rx="44"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    .intro { animation: intro 1.1s cubic-bezier(.2,.8,.2,1) both; }
    .intro.late { animation-delay: .15s; }
    @keyframes intro { from { opacity: 0; transform: translateY(-14px); } to { opacity: 1; transform: none; } }
    .role { opacity: 0; animation: role 9s ease-in-out infinite; }
    .role.b { animation-delay: 3s; }
    .role.c { animation-delay: 6s; }
    @keyframes role {
      0% { opacity: 0; transform: translateY(10px); }
      5%, 30% { opacity: 1; transform: translateY(0); }
      35%, 100% { opacity: 0; transform: translateY(-10px); }
    }
    .note { opacity: 0; transform-box: fill-box; transform-origin: center; animation: note .9s cubic-bezier(.2,.8,.2,1) both; }
    .n1 { animation-delay: .6s; }
    .n2 { animation-delay: 1s; }
    .n3 { animation-delay: 1.4s; }
    @keyframes note { from { opacity: 0; transform: translateY(36px) scale(.96); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .intro, .note { animation: none; opacity: 1; }
      .role { animation: none; }
      .role.a { opacity: 1; }
    }
  </style>

  <g clip-path="url(#screen)">
    <!-- Wallpaper -->
    <rect width="1200" height="700" fill="url(#wall)"/>
    <g filter="url(#blur)">
      <circle cx="230" cy="170" r="210" fill="#5E5CE6" opacity=".6">
        <animateTransform attributeName="transform" type="translate" values="0 0;70 40;0 0" dur="16s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1010" cy="130" r="180" fill="#0A84FF" opacity=".5">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 50;0 0" dur="19s" repeatCount="indefinite"/>
      </circle>
      <circle cx="960" cy="560" r="240" fill="#FF9F0A" opacity=".32">
        <animateTransform attributeName="transform" type="translate" values="0 0;-50 -40;0 0" dur="21s" repeatCount="indefinite"/>
      </circle>
      <circle cx="260" cy="620" r="200" fill="#FF375F" opacity=".26">
        <animateTransform attributeName="transform" type="translate" values="0 0;50 -30;0 0" dur="17s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Status bar -->
    <text x="72" y="50" font-size="20" font-weight="600" fill="#FFFFFF">9:41</text>
    <g fill="#FFFFFF">
      <rect x="1036" y="46" width="4.5" height="7" rx="1.2"/>
      <rect x="1043" y="43" width="4.5" height="10" rx="1.2"/>
      <rect x="1050" y="40" width="4.5" height="13" rx="1.2"/>
      <rect x="1057" y="37" width="4.5" height="16" rx="1.2"/>
    </g>
    <g transform="translate(1086 54)" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round">
      <path d="M-10 -10 A14 14 0 0 1 10 -10"/>
      <path d="M-5.5 -5 A8 8 0 0 1 5.5 -5"/>
      <circle cx="0" cy="-1" r="1.8" fill="#FFFFFF" stroke="none"/>
    </g>
    <rect x="1108" y="38" width="30" height="15" rx="4.5" fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="1110.5" y="40.5" width="22" height="10" rx="2.5" fill="#FFFFFF"/>
    <rect x="1140" y="43" width="2.5" height="5" rx="1" fill="#FFFFFF" fill-opacity=".5"/>

    <!-- Dynamic Island -->
    <g class="intro">
      <rect x="535" y="20" width="130" height="38" rx="19" fill="#000000">
        <animate attributeName="width" values="130;130;470;470;130;130" keyTimes="0;.1;.18;.72;.8;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
        <animate attributeName="x" values="535;535;365;365;535;535" keyTimes="0;.1;.18;.72;.8;1" dur="9s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1;.4 0 .2 1"/>
      </rect>
      <g opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;.16;.21;.7;.74;1" dur="9s" repeatCount="indefinite"/>
        <rect x="380" y="27" width="24" height="24" rx="7" fill="url(#gBlue)"/>
        <path d="M392 31 C393 36 395 38 400 39 C395 40 393 42 392 47 C391 42 389 40 384 39 C389 38 391 36 392 31 Z" fill="#FFFFFF"/>
        <text x="414" y="45" font-size="16" font-weight="600" fill="#FFFFFF">Building agentic AI</text>
        <g fill="#30D158">
          <rect x="790" y="35" width="4" height="8" rx="2">
            <animate attributeName="height" values="8;20;10;16;8" dur="1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="35;29;34;31;35" dur="1s" repeatCount="indefinite"/>
          </rect>
          <rect x="798" y="32" width="4" height="14" rx="2">
            <animate attributeName="height" values="14;6;18;10;14" dur="1.2s" repeatCount="indefinite"/>
            <animate attributeName="y" values="32;36;30;34;32" dur="1.2s" repeatCount="indefinite"/>
          </rect>
          <rect x="806" y="29" width="4" height="20" rx="2">
            <animate attributeName="height" values="20;10;14;6;20" dur=".9s" repeatCount="indefinite"/>
            <animate attributeName="y" values="29;34;32;36;29" dur=".9s" repeatCount="indefinite"/>
          </rect>
          <rect x="814" y="34" width="4" height="10" rx="2">
            <animate attributeName="height" values="10;18;6;14;10" dur="1.1s" repeatCount="indefinite"/>
            <animate attributeName="y" values="34;30;36;32;34" dur="1.1s" repeatCount="indefinite"/>
          </rect>
          <rect x="822" y="36" width="4" height="6" rx="2">
            <animate attributeName="height" values="6;14;20;8;6" dur="1.3s" repeatCount="indefinite"/>
            <animate attributeName="y" values="36;32;29;35;36" dur="1.3s" repeatCount="indefinite"/>
          </rect>
        </g>
      </g>
    </g>

    <!-- Lock screen headline -->
    <text class="intro" x="600" y="150" text-anchor="middle" font-size="22" font-weight="500" fill="#EBEBF5" fill-opacity=".75">Chennai, India</text>
    <text class="intro late" x="600" y="258" text-anchor="middle" font-size="104" font-weight="700" letter-spacing="-2.5" fill="url(#nameFill)">D Guru Prasaath</text>

    <g font-size="26" font-weight="500" fill="#EBEBF5" fill-opacity=".85" text-anchor="middle">
      <text class="role a" x="600" y="314">AI/ML engineer building agentic systems</text>
      <text class="role b" x="600" y="314">Backend engineer in Java and Spring Boot</text>
      <text class="role c" x="600" y="314">iOS developer with an app on the App Store</text>
    </g>

    <!-- Notifications -->
    <g transform="translate(280 372)">
      <g class="note n1">
        <rect width="640" height="82" rx="22" fill="#FFFFFF" fill-opacity=".11" stroke="url(#glassEdge)" stroke-width="1.2"/>
        <rect x="16" y="17" width="48" height="48" rx="12" fill="url(#gBlue)"/>
        <path d="M30 41 L37 48 L51 34" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="80" y="36" font-size="16" font-weight="600" fill="#FFFFFF">Shipped to the App Store</text>
        <text x="80" y="60" font-size="15" fill="#EBEBF5" fill-opacity=".8">My SwiftUI app is live for anyone to download</text>
        <text x="620" y="36" text-anchor="end" font-size="13" fill="#EBEBF5" fill-opacity=".55">live</text>
      </g>
    </g>
    <g transform="translate(280 466)">
      <g class="note n2">
        <rect width="640" height="82" rx="22" fill="#FFFFFF" fill-opacity=".11" stroke="url(#glassEdge)" stroke-width="1.2"/>
        <rect x="16" y="17" width="48" height="48" rx="12" fill="url(#gOrange)"/>
        <path d="M34 36 V33 A2 2 0 0 1 36 31 H44 A2 2 0 0 1 46 33 V36" fill="none" stroke="#FFFFFF" stroke-width="3"/>
        <rect x="27" y="36" width="26" height="18" rx="4" fill="#FFFFFF"/>
        <rect x="27" y="43" width="26" height="2" fill="#FF8A00" fill-opacity=".7"/>
        <text x="80" y="36" font-size="16" font-weight="600" fill="#FFFFFF">Infosys internship complete</text>
        <text x="80" y="60" font-size="15" fill="#EBEBF5" fill-opacity=".8">Software Engineering Intern in Mysore, Jan to Feb 2026</text>
        <text x="620" y="36" text-anchor="end" font-size="13" fill="#EBEBF5" fill-opacity=".55">Feb 2026</text>
      </g>
    </g>
    <g transform="translate(280 560)">
      <g class="note n3">
        <rect width="640" height="82" rx="22" fill="#FFFFFF" fill-opacity=".11" stroke="url(#glassEdge)" stroke-width="1.2"/>
        <rect x="16" y="17" width="48" height="48" rx="12" fill="url(#gGreen)"/>
        <circle cx="46" cy="36" r="4" fill="#FFFFFF" fill-opacity=".7"/>
        <path d="M39 54 A7.5 7 0 0 1 54 54 Z" fill="#FFFFFF" fill-opacity=".7"/>
        <circle cx="35" cy="35" r="5.5" fill="#FFFFFF"/>
        <path d="M25 54 A10 9 0 0 1 45 54 Z" fill="#FFFFFF"/>
        <text x="80" y="36" font-size="16" font-weight="600" fill="#FFFFFF">President, Data Science Club</text>
        <text x="80" y="60" font-size="15" fill="#EBEBF5" fill-opacity=".8">Also leading the DSBS Association at SRM</text>
        <text x="620" y="36" text-anchor="end" font-size="13" fill="#EBEBF5" fill-opacity=".55">now</text>
      </g>
    </g>

    <!-- Home indicator -->
    <rect x="530" y="670" width="140" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".8"/>
  </g>
</svg>
