<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 54" width="150" height="54" role="img" aria-label="LinkedIn">
  <title>LinkedIn</title>
  <defs>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3C" stop-opacity=".78"/>
      <stop offset="1" stop-color="#1C1C1E" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset=".5" stop-color="#FFFFFF" stop-opacity=".12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".25"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="34" cy="27" r="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A84FF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="pill"><rect x="1" y="1" width="148" height="52" rx="26"/></clipPath>
  </defs>
  <g clip-path="url(#pill)">
    <rect width="150" height="54" fill="url(#fill)"/>
    <rect width="150" height="54" fill="url(#glow)"/>
    <rect x="1" y="1" width="148" height="26" fill="url(#sheen)"/>
  </g>
  <rect x="1" y="1" width="148" height="52" rx="26" fill="none" stroke="url(#edge)" stroke-width="1.2"/>
  <rect x="22" y="15" width="24" height="24" rx="6" fill="#0A66C2"/><text x="34" y="33" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">in</text>
  <text x="56" y="32.5" font-family="-apple-system, BlinkMacSystemFont, &quot;SF Pro Text&quot;, &quot;Segoe UI&quot;, Roboto, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">LinkedIn</text>
</svg>
