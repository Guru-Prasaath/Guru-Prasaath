<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" role="img" aria-labelledby="title desc">
  <title id="title">About D Guru Prasaath</title>
  <desc id="desc">iOS-style widgets: B.Tech CSE (Data Science) at SRM IST Chennai, class of 2027; currently building agentic AI and RAG, Java and Spring Boot backends, and SwiftUI apps; practicing DSA in Java; off-screen, cricket, movies and music.</desc>
  <defs>
    <linearGradient id="wall" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1030"/>
      <stop offset=".5" stop-color="#1A1F5E"/>
      <stop offset="1" stop-color="#2A1442"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".45"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"/>
    </linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3AA0FF"/>
      <stop offset="1" stop-color="#5E5CE6"/>
    </linearGradient>
    <linearGradient id="gSunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF375F"/>
      <stop offset="1" stop-color="#FF9F0A"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <clipPath id="screen">
      <rect width="1200" height="500" rx="44"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  </style>

  <g clip-path="url(#screen)">
    <rect width="1200" height="500" fill="url(#wall)"/>
    <g filter="url(#blur)">
      <circle cx="1000" cy="90" r="200" fill="#5E5CE6" opacity=".55">
        <animateTransform attributeName="transform" type="translate" values="0 0;-60 40;0 0" dur="18s" repeatCount="indefinite"/>
      </circle>
      <circle cx="160" cy="460" r="220" fill="#FF9F0A" opacity=".28">
        <animateTransform attributeName="transform" type="translate" values="0 0;60 -30;0 0" dur="20s" repeatCount="indefinite"/>
      </circle>
      <circle cx="600" cy="260" r="180" fill="#0A84FF" opacity=".35">
        <animateTransform attributeName="transform" type="translate" values="0 0;40 30;0 0" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Large widget: profile -->
    <rect x="40" y="40" width="540" height="400" rx="34" fill="#FFFFFF" fill-opacity=".1" stroke="url(#glassEdge)" stroke-width="1.2"/>
    <circle cx="112" cy="116" r="44" fill="url(#gBlue)"/>
    <text x="112" y="129" text-anchor="middle" font-size="34" font-weight="700" fill="#FFFFFF">GP</text>
    <text x="176" y="108" font-size="28" font-weight="700" fill="#FFFFFF">D Guru Prasaath</text>
    <text x="176" y="138" font-size="17" fill="#EBEBF5" fill-opacity=".62">AI-integrated backend engineer</text>
    <line x1="72" y1="186" x2="548" y2="186" stroke="#FFFFFF" stroke-opacity=".14"/>

    <g font-size="18">
      <!-- Degree -->
      <rect x="72" y="210" width="28" height="28" rx="8" fill="#0A84FF"/>
      <polygon points="86,216 97,221 86,226 75,221" fill="#FFFFFF"/>
      <rect x="80" y="223" width="12" height="7" rx="2" fill="#FFFFFF"/>
      <text x="114" y="231" fill="#FFFFFF">Degree</text>
      <text x="548" y="231" text-anchor="end" font-size="17" fill="#EBEBF5" fill-opacity=".62">B.Tech CSE, Data Science</text>
      <line x1="114" y1="256" x2="548" y2="256" stroke="#FFFFFF" stroke-opacity=".1"/>

      <!-- Campus -->
      <rect x="72" y="262" width="28" height="28" rx="8" fill="#30D158"/>
      <path d="M86 285 C81 279 79 276 79 273 A7 7 0 0 1 93 273 C93 276 91 279 86 285 Z" fill="#FFFFFF"/>
      <circle cx="86" cy="273" r="2.5" fill="#30D158"/>
      <text x="114" y="283" fill="#FFFFFF">Campus</text>
      <text x="548" y="283" text-anchor="end" font-size="17" fill="#EBEBF5" fill-opacity=".62">SRM IST, Chennai</text>
      <line x1="114" y1="308" x2="548" y2="308" stroke="#FFFFFF" stroke-opacity=".1"/>

      <!-- Graduating -->
      <rect x="72" y="314" width="28" height="28" rx="8" fill="#FF453A"/>
      <rect x="78" y="321" width="16" height="15" rx="3" fill="#FFFFFF"/>
      <rect x="78" y="321" width="16" height="4" rx="1.5" fill="#FFB3AE"/>
      <text x="114" y="335" fill="#FFFFFF">Graduating</text>
      <text x="548" y="335" text-anchor="end" font-size="17" fill="#EBEBF5" fill-opacity=".62">Class of 2027</text>
      <line x1="114" y1="360" x2="548" y2="360" stroke="#FFFFFF" stroke-opacity=".1"/>

      <!-- Focus -->
      <rect x="72" y="366" width="28" height="28" rx="8" fill="#BF5AF2"/>
      <path d="M86 372 C87 377 89 379 94 380 C89 381 87 383 86 388 C85 383 83 381 78 380 C83 379 85 377 86 372 Z" fill="#FFFFFF"/>
      <text x="114" y="387" fill="#FFFFFF">Focus</text>
      <text x="548" y="387" text-anchor="end" font-size="17" fill="#EBEBF5" fill-opacity=".62">Java backends + LLMs</text>
    </g>

    <!-- Medium widget: currently building -->
    <rect x="620" y="40" width="540" height="185" rx="34" fill="#FFFFFF" fill-opacity=".1" stroke="url(#glassEdge)" stroke-width="1.2"/>
    <g transform="rotate(-90 712 132.5)" fill="none" stroke-width="12" stroke-linecap="round">
      <circle cx="712" cy="132.5" r="62" stroke="#BF5AF2" stroke-opacity=".22"/>
      <circle cx="712" cy="132.5" r="46" stroke="#0A84FF" stroke-opacity=".22"/>
      <circle cx="712" cy="132.5" r="30" stroke="#FF9F0A" stroke-opacity=".22"/>
      <circle cx="712" cy="132.5" r="62" stroke="#BF5AF2" stroke-dasharray="389.6" stroke-dashoffset="389.6">
        <animate attributeName="stroke-dashoffset" from="389.6" to="58.4" begin=".3s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
      </circle>
      <circle cx="712" cy="132.5" r="46" stroke="#0A84FF" stroke-dasharray="289" stroke-dashoffset="289">
        <animate attributeName="stroke-dashoffset" from="289" to="86.7" begin=".5s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
      </circle>
      <circle cx="712" cy="132.5" r="30" stroke="#FF9F0A" stroke-dasharray="188.5" stroke-dashoffset="188.5">
        <animate attributeName="stroke-dashoffset" from="188.5" to="84.8" begin=".7s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/>
      </circle>
    </g>
    <text x="820" y="88" font-size="15" font-weight="600" fill="#EBEBF5" fill-opacity=".62">Currently building</text>
    <g font-size="19" font-weight="500" fill="#FFFFFF">
      <circle cx="828" cy="120" r="6" fill="#BF5AF2"/>
      <text x="844" y="126">Agentic AI and RAG</text>
      <circle cx="828" cy="152" r="6" fill="#0A84FF"/>
      <text x="844" y="158">Java and Spring Boot</text>
      <circle cx="828" cy="184" r="6" fill="#FF9F0A"/>
      <text x="844" y="190">SwiftUI apps</text>
    </g>

    <!-- Small widget: focus -->
    <rect x="620" y="255" width="255" height="185" rx="34" fill="#FFFFFF" fill-opacity=".1" stroke="url(#glassEdge)" stroke-width="1.2"/>
    <circle cx="672" cy="303" r="22" fill="#5E5CE6"/>
    <circle cx="670" cy="304" r="10" fill="#FFFFFF"/>
    <circle cx="675" cy="299" r="9" fill="#5E5CE6"/>
    <text x="650" y="368" font-size="15" fill="#EBEBF5" fill-opacity=".62">Focus</text>
    <text x="650" y="396" font-size="22" font-weight="700" fill="#FFFFFF">DSA in Java</text>
    <text x="650" y="420" font-size="15" fill="#EBEBF5" fill-opacity=".62">Trees and recursion</text>

    <!-- Small widget: off-screen -->
    <rect x="905" y="255" width="255" height="185" rx="34" fill="#FFFFFF" fill-opacity=".1" stroke="url(#glassEdge)" stroke-width="1.2"/>
    <rect x="935" y="281" width="44" height="44" rx="11" fill="url(#gSunset)"/>
    <circle cx="957" cy="303" r="12" fill="#FFFFFF"/>
    <path d="M955 292.2 Q954 303 955 313.8 M959 292.2 Q960 303 959 313.8" fill="none" stroke="#FF375F" stroke-width="1.6" stroke-linecap="round"/>
    <g fill="#FF375F">
      <rect x="1098" y="296" width="4" height="12" rx="2">
        <animate attributeName="height" values="12;24;8;18;12" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="296;290;298;293;296" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="1106" y="292" width="4" height="20" rx="2">
        <animate attributeName="height" values="20;8;22;12;20" dur=".9s" repeatCount="indefinite"/>
        <animate attributeName="y" values="292;298;291;296;292" dur=".9s" repeatCount="indefinite"/>
      </rect>
      <rect x="1114" y="298" width="4" height="8" rx="2">
        <animate attributeName="height" values="8;18;24;10;8" dur="1.3s" repeatCount="indefinite"/>
        <animate attributeName="y" values="298;293;290;297;298" dur="1.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="1122" y="294" width="4" height="16" rx="2">
        <animate attributeName="height" values="16;10;20;6;16" dur="1s" repeatCount="indefinite"/>
        <animate attributeName="y" values="294;297;292;299;294" dur="1s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text x="935" y="368" font-size="15" fill="#EBEBF5" fill-opacity=".62">Off-screen</text>
    <text x="935" y="396" font-size="19" font-weight="700" fill="#FFFFFF">Cricket highlights</text>
    <text x="935" y="420" font-size="15" fill="#EBEBF5" fill-opacity=".62">Movies and music too</text>

    <!-- Page dots -->
    <circle cx="588" cy="472" r="4" fill="#FFFFFF" fill-opacity=".35"/>
    <circle cx="612" cy="472" r="4" fill="#FFFFFF"/>
  </g>
</svg>
